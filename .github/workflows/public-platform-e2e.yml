name: Rhodium public platform – browser and delivery E2E
on:
  push:
    branches: [main]
    paths:
      - index.html
      - kundenportal.html
      - CNAME
      - .github/workflows/public-platform-e2e.yml
      - tests/public-showcase.spec.mjs
      - impressum.html
      - datenschutz.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright package
        run: npm install --no-save playwright@1.58.2
      - name: Run real browser tests on delivered HTML
        run: node tests/public-showcase.spec.mjs
      - name: Verify public domain for this release (required)
        run: |
          node -e "const fs=require('fs'); const html=fs.readFileSync('index.html','utf8'); const m=html.match(/name=\"rhodium-release\" content=\"([^\"]+)\"/);if(!m) process.exit(2); fetch('https://rhodium-germany.de/?rhodium-check='+Date.now(),{redirect:'follow'}).then(async r=>{const t=await r.text();console.log(JSON.stringify({status:r.status,release:m[1],deployed:t.includes(m[1]),hasLocalTest:t.includes('gratis-run')}));if(!r.ok||!t.includes(m[1])||!t.includes('gratis-run'))process.exitCode=1;}).catch(e=>{console.log('PUBLIC DOMAIN NOT VERIFIED:',e.message);process.exitCode=1})"

      - name: Verify public legal pages (required)
        run: |
          node -e "Promise.all(['impressum.html','datenschutz.html'].map(async p=>{const r=await fetch('https://rhodium-germany.de/'+p);const t=await r.text();if(!r.ok||!t.includes('<h1>'))throw Error(p+' not verified');console.log(p,r.status)})).catch(e=>{console.error(e.message);process.exitCode=1})"
